<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,100;0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'TH Sarabun PSK', 'TH Sarabun New', 'Sarabun', sans-serif;
            background: white;
            padding: 40px;
        }
        .staff-grid {
            display: grid;
            grid-template-columns: 26mm 22mm 8mm 20mm;
            font-size: 13.5pt;
            font-weight: 300;
            line-height: 1.25;
        }
        .staff-grid div {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div style="border: 1px dashed #ccc; padding: 10px; width: fit-content;">
        <div class="staff-grid">
            <div style="text-align: left;">จ.ส.อ.</div>
            <div style="text-align: left;">ร่าง/ตรวจ</div>
            <div></div>
            <div style="text-align: left;">มิ.ย. ๖๙</div>
            <div style="text-align: left;">ส.ท. วรากรฯ</div>
            <div style="text-align: left;">พิมพ์/ทาน</div>
            <div style="text-align: right; padding-right: 2.5mm;">๑๙</div>
            <div style="text-align: left;">มิ.ย. ๖๙</div>
        </div>
    </div>
</body>
</html>
